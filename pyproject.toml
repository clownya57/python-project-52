[project]
name = "hexlet-code"
version = "0.1.0"
description = "Task Manager built with Django"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
exclude = [
    "*/migrations/*",
    "task_manager/settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
